name: One-shot data split migration

on:
  push:
    branches: ["perf/data-code-split"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/data-code-split
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Generate web data shards
        run: python -X utf8 tooling/scripts/build_web_data.py
      - name: Apply data-split refactor
        shell: python
        run: |
          from pathlib import Path

          # Domain types: allow calendar helpers to operate on lightweight entries.
          path = Path('src/domain/calendar.ts')
          text = path.read_text(encoding='utf-8')
          old = '''export type Scientist = {\n  id: string;\n  month: number;\n  day: number;\n  name: string;\n  latinName: string;\n  years: string;\n  field: Field;\n  country: string;\n  color: string;\n  relation: string;\n  tagline: string;\n  story: string;\n  contribution: string;\n  fact: string;\n  quote?: string;\n  quoteSource?: string;\n};'''
          new = '''export type ScientistSummary = {\n  id: string;\n  month: number;\n  day: number;\n  name: string;\n  latinName: string;\n  years: string;\n  field: Field;\n  country: string;\n  color: string;\n  relation: string;\n  tagline: string;\n  contribution: string;\n};\n\nexport type Scientist = ScientistSummary & {\n  story: string;\n  fact: string;\n  quote?: string;\n  quoteSource?: string;\n};'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''export function getScientistForDate(\n  scientists: Scientist[],\n  date: DateParts,\n): Scientist | undefined {'''
          new = '''export function getScientistForDate<T extends { month: number; day: number }>(\n  scientists: T[],\n  date: DateParts,\n): T | undefined {'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # Client page: import lightweight index and lazy-load one month of details.
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ('import { useMemo, useState } from "react";', 'import { useEffect, useMemo, useState } from "react";'),
            ('import quotes from "./data/quotes.json";\nimport scientistsData from "./data/scientists.json";', 'import scientistsData from "./data/scientists-index.json";'),
            ('  type Scientist,\n  type Field,', '  type ScientistSummary,\n  type Field,'),
            ('const scientists = scientistsData as Scientist[];', 'const scientists = scientistsData as ScientistSummary[];'),
            ('type AvatarMode = "letter" | "photo";', 'type AvatarMode = "letter" | "photo";\ntype ScientistDetail = { story: string; fact: string; quote?: string; quoteSource?: string };\ntype MonthDetails = Record<string, ScientistDetail>;'),
            ('function avatarFor(scientist: Scientist, mode: AvatarMode): string | null {', 'function avatarFor(scientist: ScientistSummary, mode: AvatarMode): string | null {'),
            ('const ARCHIVE_PAGE_SIZE = 48;', '''const ARCHIVE_PAGE_SIZE = 48;\nconst detailLoaders: Record<number, () => Promise<{ default: MonthDetails }>> = {\n  1: () => import("./data/details/01.json"),\n  2: () => import("./data/details/02.json"),\n  3: () => import("./data/details/03.json"),\n  4: () => import("./data/details/04.json"),\n  5: () => import("./data/details/05.json"),\n  6: () => import("./data/details/06.json"),\n  7: () => import("./data/details/07.json"),\n  8: () => import("./data/details/08.json"),\n  9: () => import("./data/details/09.json"),\n  10: () => import("./data/details/10.json"),\n  11: () => import("./data/details/11.json"),\n  12: () => import("./data/details/12.json"),\n};'''),
            ('  const [archiveLimit, setArchiveLimit] = useState(ARCHIVE_PAGE_SIZE);', '  const [archiveLimit, setArchiveLimit] = useState(ARCHIVE_PAGE_SIZE);\n  const [detailsById, setDetailsById] = useState<MonthDetails>({});'),
            ('  const selectedQuote = quotes[selected.id as keyof typeof quotes] ?? (selected.quote && selected.quoteSource ? { text: selected.quote, source: selected.quoteSource } : undefined);\n  const isTodaySelection = selected.id === todayScientist?.id;', '''  const selectedDetail = detailsById[selected.id];\n  const selectedQuote = selectedDetail?.quote && selectedDetail.quoteSource ? { text: selectedDetail.quote, source: selectedDetail.quoteSource } : undefined;\n  const isTodaySelection = selected.id === todayScientist?.id;\n\n  useEffect(() => {\n    if (detailsById[selected.id]) return;\n    let cancelled = false;\n    void detailLoaders[selected.month]().then((module) => {\n      if (!cancelled) {\n        setDetailsById((current) => ({ ...current, ...(module.default as MonthDetails) }));\n      }\n    });\n    return () => { cancelled = true; };\n  }, [selected.id, selected.month, detailsById]);'''),
            ('  const monthEntriesByDay = new Map<number, Scientist[]>();', '  const monthEntriesByDay = new Map<number, ScientistSummary[]>();'),
            ('  function selectScientist(scientist: Scientist) {', '  function selectScientist(scientist: ScientistSummary) {'),
            ('<p className="feature-story">{selected.story}</p>', '<p className="feature-story">{selectedDetail?.story ?? "正在加载人物档案…"}</p>'),
            ('<div><span>你知道吗</span><strong>{selected.fact}</strong></div>', '<div><span>你知道吗</span><strong>{selectedDetail?.fact ?? "正在加载…"}</strong></div>'),
          ]
          for old, new in replacements:
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'expected exactly one match, got {count}: {old[:100]}')
            text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          # package.json scripts.
          path = Path('package.json')
          text = path.read_text(encoding='utf-8')
          old = '    "audit:data": "python -X utf8 tooling/scripts/audit_data.py",'
          new = '    "audit:data": "python -X utf8 tooling/scripts/audit_data.py",\n    "build:web-data": "python -X utf8 tooling/scripts/build_web_data.py",\n    "check:web-data": "python -X utf8 tooling/scripts/build_web_data.py --check",'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')

          # Quality must reject stale generated shards.
          path = Path('.github/workflows/quality.yml')
          text = path.read_text(encoding='utf-8')
          old = '      - name: Audit data（365 天平年覆盖 + 结构 + 关联）\n        run: npm run audit:data'
          new = '      - name: Audit data（365 天平年覆盖 + 结构 + 关联）\n        run: npm run audit:data\n\n      - name: Check generated web data\n        run: npm run check:web-data'
          assert text.count(old) == 1
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Install dependencies
        run: npm ci
      - name: Typecheck app
        run: npm run typecheck
      - name: Typecheck worker
        run: npm run typecheck:worker
      - name: Lint
        run: npm run lint
      - name: Audit data
        run: npm run audit:data
      - name: Check generated data
        run: npm run check:web-data
      - name: Test
        run: npm test
      - name: Build Pages
        run: npm run build:pages
      - name: Report bundle sizes
        run: ls -lh docs/assets/*.js
      - name: Commit validated migration and remove one-shot workflow
        run: |
          git config user.name "CochraneK"
          git config user.email "48022373+CochraneK@users.noreply.github.com"
          git rm .github/workflows/data-split-once.yml
          git add app/page.tsx app/data/scientists-index.json app/data/details src/domain/calendar.ts package.json .github/workflows/quality.yml
          git commit -m "perf: lazy-load monthly scientist details [data-split-generated]"
          git push origin HEAD:perf/data-code-split
