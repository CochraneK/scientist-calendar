name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python（确保 python 可用，供 audit:data 使用）
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit data（365 天平年覆盖 + 结构 + 关联）
        run: npm run audit:data

      - name: Test（含 vinext 构建 + 渲染测试）
        run: npm test

      - name: Build GitHub Pages artifact
        run: npm run build:pages
