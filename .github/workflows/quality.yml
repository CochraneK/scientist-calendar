name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python（确保 python 可用，供 audit:data 使用）
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit:deps

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Audit data（365 天平年覆盖 + 结构 + 关联）
        run: npm run audit:data

      - name: Check generated web data
        run: npm run check:web-data

      - name: Test（含 vinext 构建 + 渲染测试）
        run: npm test

      - name: Build GitHub Pages artifact
        run: npm run build:pages
