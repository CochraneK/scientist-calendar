name: One-shot archive performance refactor

on:
  push:
    branches: [perf/archive-rendering]

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, '[archive-perf-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/archive-rendering
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Apply focused archive rendering refactor
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'const weekdayNames = ["日", "一", "二", "三", "四", "五", "六"];',
                  'const weekdayNames = ["日", "一", "二", "三", "四", "五", "六"];\nconst ARCHIVE_PAGE_SIZE = 48;'
              ),
              (
                  '  const [avatarMode, setAvatarMode] = useState<AvatarMode>("letter");',
                  '  const [avatarMode, setAvatarMode] = useState<AvatarMode>("letter");\n  const [archiveLimit, setArchiveLimit] = useState(ARCHIVE_PAGE_SIZE);'
              ),
              (
                  '  const selectedQuote = quotes[selected.id as keyof typeof quotes] ?? (selected.quote && selected.quoteSource ? { text: selected.quote, source: selected.quoteSource } : undefined);',
                  '  const selectedQuote = quotes[selected.id as keyof typeof quotes] ?? (selected.quote && selected.quoteSource ? { text: selected.quote, source: selected.quoteSource } : undefined);\n  const isTodaySelection = selected.id === todayScientist?.id;'
              ),
              (
                  '  }), [activeField, query]);',
                  '  }), [activeField, query]);\n  const visibleScientists = filtered.slice(0, archiveLimit);'
              ),
              (
                  '<header className="section-heading"><div><p className="eyebrow">TODAY&apos;S NOTE · {formatDate(selected.month, selected.day)}</p><h2 id="today-title">今日人物</h2></div>',
                  '<header className="section-heading"><div><p className="eyebrow">{isTodaySelection ? "TODAY&apos;S NOTE" : "ARCHIVE NOTE"} · {formatDate(selected.month, selected.day)}</p><h2 id="today-title">{isTodaySelection ? "今日人物" : "人物档案"}</h2></div>'
              ),
              (
                  '<blockquote className="quote-block"><span>今日引语</span>',
                  '<blockquote className="quote-block"><span>{isTodaySelection ? "今日引语" : "人物引语"}</span>'
              ),
              (
                  '<input value={query} onChange={(event) => setQuery(event.target.value)} placeholder="搜索人物、领域或贡献" aria-label="搜索科学家档案" />',
                  '<input value={query} onChange={(event) => { setQuery(event.target.value); setArchiveLimit(ARCHIVE_PAGE_SIZE); }} placeholder="搜索人物、领域或贡献" aria-label="搜索科学家档案" />'
              ),
              (
                  'onClick={() => setActiveField(field)}>{field}</button>)}</div>',
                  'onClick={() => { setActiveField(field); setArchiveLimit(ARCHIVE_PAGE_SIZE); }}>{field}</button>)}</div>'
              ),
              (
                  'onClick={() => { setActiveField("全部"); setQuery(""); }}>清除筛选</button>',
                  'onClick={() => { setActiveField("全部"); setQuery(""); setArchiveLimit(ARCHIVE_PAGE_SIZE); }}>清除筛选</button>'
              ),
              (
                  '<div className="archive-grid">{filtered.map((scientist, index) =>',
                  '<div className="archive-grid">{visibleScientists.map((scientist, index) =>'
              ),
              (
                  '</button>)}</div>\n        {!filtered.length && <p className="empty-state">',
                  '</button>)}</div>\n        {visibleScientists.length < filtered.length && <button className="button-secondary" type="button" onClick={() => setArchiveLimit((limit) => Math.min(limit + ARCHIVE_PAGE_SIZE, filtered.length))}>加载更多 · 还剩 {filtered.length - visibleScientists.length} 位 <span>↓</span></button>}\n        {!filtered.length && <p className="empty-state">'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: npm ci
      - name: Typecheck app
        run: npm run typecheck
      - name: Typecheck worker
        run: npm run typecheck:worker
      - name: Lint
        run: npm run lint
      - name: Audit data
        run: npm run audit:data
      - name: Test
        run: npm test
      - name: Build Pages
        run: npm run build:pages

      - name: Commit validated refactor and remove one-shot workflow
        run: |
          git config user.name "CochraneK"
          git config user.email "48022373+CochraneK@users.noreply.github.com"
          git rm .github/workflows/perf-archive-once.yml
          git add app/page.tsx
          git commit -m "perf: progressively render archive cards [archive-perf-generated]"
          git push origin HEAD:perf/archive-rendering
