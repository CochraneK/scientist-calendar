name: Temporary web source disclosure

on:
  push:
    branches: ["feat/web-source-disclosure"]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/web-source-disclosure
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Apply web-only source UI and PDF no-link guard
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text(encoding='utf-8')
          old = 'type ScientistDetail = { story: string; fact: string; quote?: string; quoteSource?: string };\ntype MonthDetails = Record<string, ScientistDetail>;'
          new = '''type ScientistDetail = { story: string; fact: string; quote?: string; quoteSource?: string };
          type ScientistSource = { title: string; publisher: string; url: string; covers: string[]; notes?: string };
          type ScientistSourceFile = { scientists: Record<string, ScientistSource[]> };
          type MonthDetails = Record<string, ScientistDetail>;'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '  const [shareNotice, setShareNotice] = useState("");\n'
          new = '''  const [shareNotice, setShareNotice] = useState("");
            const [sourceRegistry, setSourceRegistry] = useState<Record<string, ScientistSource[]> | null>(null);
            const [sourcesOpen, setSourcesOpen] = useState(false);
            const [sourceLoadFailed, setSourceLoadFailed] = useState(false);
          '''
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = '  async function shareSelectedScientist() {'
          assert text.count(marker) == 1
          insertion = '''  async function toggleSources() {
            if (sourcesOpen) {
              setSourcesOpen(false);
              return;
            }
            setSourceLoadFailed(false);
            if (!sourceRegistry) {
              try {
                const module = await import("./data/scientist-sources.json");
                setSourceRegistry((module.default as ScientistSourceFile).scientists);
              } catch {
                setSourceLoadFailed(true);
              }
            }
            setSourcesOpen(true);
          }

          '''
          text = text.replace(marker, insertion + marker)

          old = '<button className="detail-button" type="button" onClick={() => { void shareSelectedScientist(); }}>分享人物 <span>↗</span></button>{shareNotice && <span className="share-notice" role="status" aria-live="polite">{shareNotice}</span>}<button className="detail-button" type="button" onClick={() => document.getElementById("explore")?.scrollIntoView({ behavior: "smooth" })}>在档案库中继续探索 <span>→</span></button>'
          new = '''<button className="detail-button" type="button" onClick={() => { void shareSelectedScientist(); }}>分享人物 <span>↗</span></button>{shareNotice && <span className="share-notice" role="status" aria-live="polite">{shareNotice}</span>}<button className="source-toggle" type="button" aria-expanded={sourcesOpen} onClick={() => { void toggleSources(); }}>资料来源 <span>{sourcesOpen ? "−" : "+"}</span></button>{sourcesOpen && <div className="source-panel" aria-live="polite">{sourceLoadFailed ? <p>资料来源暂时无法加载，请稍后重试。</p> : sourceRegistry?.[selected.id]?.length ? <ul>{sourceRegistry[selected.id].map((source) => <li key={source.url}><a href={source.url} target="_blank" rel="noreferrer"><strong>{source.publisher}</strong><span>{source.title}</span></a></li>)}</ul> : <p>该人物的资料来源正在逐步补齐。</p>}</div>}<button className="detail-button" type="button" onClick={() => document.getElementById("explore")?.scrollIntoView({ behavior: "smooth" })}>在档案库中继续探索 <span>→</span></button>'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          page.write_text(text, encoding='utf-8')

          css = Path('app/globals.css')
          c = css.read_text(encoding='utf-8')
          addition = '''
          .source-toggle { align-self: flex-start; margin-top: 14px; padding: 3px 0; border: 0; background: none; color: #7b8794; cursor: pointer; font: 11px Arial, "Microsoft YaHei", sans-serif; letter-spacing: .04em; }
          .source-toggle:hover { color: var(--ink); }
          .source-toggle span { margin-left: 7px; }
          .source-panel { max-width: 650px; margin-top: 8px; padding: 12px 0 2px; border-top: 1px solid #ebe4d8; color: #6d7885; font: 11px/1.55 Arial, "Microsoft YaHei", sans-serif; }
          .source-panel p { margin: 0; }
          .source-panel ul { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
          .source-panel a { display: grid; grid-template-columns: minmax(110px, auto) 1fr; gap: 10px; align-items: baseline; }
          .source-panel a:hover span { text-decoration: underline; text-underline-offset: 2px; }
          .source-panel strong { color: #556273; font-size: 10px; font-weight: 600; }
          .source-panel span { min-width: 0; color: #7a8591; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          '''
          assert '.source-toggle {' not in c
          css.write_text(c.rstrip() + '\n' + addition.strip() + '\n', encoding='utf-8')

          verifier = Path('tooling/scripts/verify_pdf_layout.py')
          v = verifier.read_text(encoding='utf-8')
          v = v.replace('PDF 排版体检：几何方式检测「文字压字 / 越界 / 卡片内混入外来文字」。', 'PDF 排版体检：检测「文字压字 / 越界 / 卡片内混入外来文字 / 超链接注释」。')
          old = '    tofu: list[tuple] = []\n\n    for pno in range(doc.page_count):'
          new = '    tofu: list[tuple] = []\n    links: list[tuple] = []\n\n    for pno in range(doc.page_count):'
          assert v.count(old) == 1
          v = v.replace(old, new)
          old = '        page = doc[pno]\n        # 豆腐块检测'
          new = '''        page = doc[pno]
                  for link in page.get_links():
                      links.append((pno + 1, link.get("uri") or link.get("file") or f"kind={link.get('kind')}"))
                  # 豆腐块检测'''
          assert v.count(old) == 1
          v = v.replace(old, new)
          old = '    total = len(pairwise) + len(leaks) + len(oob) + len(tofu)\n    return doc.page_count, pairwise, leaks, oob, tofu, total'
          new = '    total = len(pairwise) + len(leaks) + len(oob) + len(tofu) + len(links)\n    return doc.page_count, pairwise, leaks, oob, tofu, links, total'
          assert v.count(old) == 1
          v = v.replace(old, new)
          old = '    pages, pairwise, leaks, oob, tofu, total = verify('
          new = '    pages, pairwise, leaks, oob, tofu, links, total = verify('
          assert v.count(old) == 1
          v = v.replace(old, new)
          old = '    report("豆腐块（中文用拉丁字体渲染成连续 I）", tofu)\n\n    status = "✓ 通过" if total == 0 else f"✗ 发现 {total} 处"\n    print(f"== 汇总：{status}（压字 {len(pairwise)} / 越界 {len(oob)} / 卡片泄漏 {len(leaks)} / 豆腐块 {len(tofu)}）==")'
          new = '''    report("豆腐块（中文用拉丁字体渲染成连续 I）", tofu)
              report("PDF 超链接注释", links)

              status = "✓ 通过" if total == 0 else f"✗ 发现 {total} 处"
              print(f"== 汇总：{status}（压字 {len(pairwise)} / 越界 {len(oob)} / 卡片泄漏 {len(leaks)} / 豆腐块 {len(tofu)} / 链接 {len(links)}）==")'''
          assert v.count(old) == 1
          v = v.replace(old, new)
          verifier.write_text(v, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Install PDF tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Validate
        run: |
          npm run audit:sources
          npm run typecheck
          npm run lint
          npm run build:pages
          npm run check:pages
          npm run pdf:build
      - name: Commit product changes
        run: |
          git rm .github/workflows/temp-web-source-disclosure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css tooling/scripts/verify_pdf_layout.py
          git commit -m "feat: show sources on web without linking print PDFs"
          git push origin HEAD:feat/web-source-disclosure
