name: Fix audit year

on:
  push:
    branches: [chore/dynamic-audit-year]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[audit-year-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: npm ci

      - name: Replace hard-coded audit year
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tooling/scripts/audit_data.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "import unicodedata\nfrom pathlib import Path",
              "import unicodedata\nfrom datetime import date\nfrom pathlib import Path",
          )
          text = text.replace(
              'AVATAR_DIR = ROOT / "public" / "avatars"\n',
              'AVATAR_DIR = ROOT / "public" / "avatars"\nCURRENT_YEAR = date.today().year\n',
          )
          count = text.count("> 2026")
          if count != 2:
              raise SystemExit(f"expected 2 hard-coded year checks, found {count}")
          text = text.replace("> 2026", "> CURRENT_YEAR")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Audit data
        run: npm run audit:data

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build GitHub Pages artifact
        run: npm run build:pages

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tooling/scripts/audit_data.py
          git diff --cached --quiet && exit 0
          git commit -m "chore: derive audit year dynamically [audit-year-fixed]"
          git push origin HEAD:${GITHUB_REF_NAME}
