name: One-shot safe toolchain security upgrades

on:
  push:
    branches: ["security/toolchain-audit-fixes"]

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/toolchain-audit-fixes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Upgrade direct packages with non-major security fixes
        run: |
          npm install \
            react@19.2.8 \
            react-dom@19.2.8
          npm install --save-dev \
            @cloudflare/vite-plugin@1.54.8 \
            @cloudflare/workers-types@5.20260911.1 \
            vite@8.3.0 \
            wrangler@4.131.1 \
            react-server-dom-webpack@19.2.8
          npm audit fix
      - name: Install lockfile cleanly
        run: npm ci
      - name: Typecheck app
        run: npm run typecheck
      - name: Typecheck worker
        run: npm run typecheck:worker
      - name: Lint
        run: npm run lint
      - name: Audit data
        run: npm run audit:data
      - name: Check generated data
        run: npm run check:web-data
      - name: Test
        run: npm test
      - name: Build Pages
        run: npm run build:pages
      - name: Production audit
        run: npm audit --omit=dev --json || true
      - name: Full audit
        run: npm audit --json || true
      - name: Commit validated dependency changes
        run: |
          git config user.name "CochraneK"
          git config user.email "48022373+CochraneK@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update toolchain dependencies [security-generated]"
          git push origin HEAD:security/toolchain-audit-fixes
