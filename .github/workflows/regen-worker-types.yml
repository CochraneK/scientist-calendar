name: Regenerate Worker types lockfile

on:
  push:
    branches: [chore/worker-typecheck-and-audit-year]

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[worker-types-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Add Cloudflare Worker platform types
        run: npm install --save-dev --save-exact @cloudflare/workers-types@4.20260702.1

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Lint
        run: npm run lint

      - name: Audit data
        run: npm run audit:data

      - name: Test
        run: npm test

      - name: Build GitHub Pages artifact
        run: npm run build:pages

      - name: Commit regenerated dependency metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: add Cloudflare Worker types [worker-types-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
