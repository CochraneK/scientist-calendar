name: One-shot PDF tooling validation

on:
  push:
    branches: ["chore/reproducible-pdf-tooling"]

permissions:
  contents: read

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install pinned PDF tooling
        run: python -m pip install -r tooling/requirements.txt
      - name: Generate daily PDF
        run: python -X utf8 tooling/scripts/generate_print_calendar.py
      - name: Generate monthly PDF
        run: python -X utf8 tooling/scripts/generate_monthly_calendar.py
      - name: Verify daily PDF
        run: python -X utf8 tooling/scripts/verify_pdf_layout.py "output/pdf/科学家日历_精选466位_A4打印版.pdf" --quiet
      - name: Verify monthly PDF
        run: python -X utf8 tooling/scripts/verify_pdf_layout.py "output/pdf/科学家日历_月度生日版_A4.pdf" --quiet
