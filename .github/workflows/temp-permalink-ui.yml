name: Temporary permalink UI migration

on:
  push:
    branches: ["feat/scientist-permalinks-seo"]

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/scientist-permalinks-seo

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Apply deterministic page migration
        run: |
          if [ -f tooling/scripts/apply_permalink_ui_patch.mjs ]; then
            python - <<'PY'
          from pathlib import Path
          path = Path("tooling/scripts/apply_permalink_ui_patch.mjs")
          text = path.read_text(encoding="utf-8")
          old = '  if (matches !== 1) throw new Error(`${label}: expected exactly one match, found ${matches}`);'
          new = '  const expectedMatches = label === "hero daily PDF path" ? 2 : 1;\n  if (matches !== expectedMatches) throw new Error(`${label}: expected exactly ${expectedMatches} match(es), found ${matches}`);'
          if text.count(old) != 1:
              raise SystemExit("unexpected migration helper shape")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
            node tooling/scripts/apply_permalink_ui_patch.mjs
            rm tooling/scripts/apply_permalink_ui_patch.mjs
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify full quality gate
        run: |
          npm run audit:deps
          npm run typecheck
          npm run typecheck:worker
          npm run lint
          npm run audit:data
          npm run audit:avatars
          npm run check:web-data
          npm test
          npm run build:pages
          npm run check:pages

      - name: Commit migrated UI
        run: |
          if git diff --quiet -- app/page.tsx tooling/scripts/apply_permalink_ui_patch.mjs; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx tooling/scripts/apply_permalink_ui_patch.mjs
          git commit -m "feat: sync scientist selection with permanent URLs"
          git push origin HEAD:feat/scientist-permalinks-seo
