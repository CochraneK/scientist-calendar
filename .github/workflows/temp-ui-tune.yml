name: Temporary UI tune

on:
  push:
    branches: ["feat/ui-polish"]

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ui-polish
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Clean UI implementation details
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one match for {old[:90]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          page = Path("app/page.tsx")
          text = page.read_text(encoding="utf-8")
          old = '''  async function toggleSources() {
          if (sourcesOpen) {
            setSourcesOpen(false);
            return;
          }
          setSourceLoadFailed(false);
          if (!sourceRegistry) {
            try {
              const sourceData = await import("./data/scientist-sources.json");
              setSourceRegistry((sourceData.default as ScientistSourceFile).scientists);
            } catch {
              setSourceLoadFailed(true);
            }
          }
          setSourcesOpen(true);
        }
          '''
          new = '''  async function toggleSources() {
            if (sourcesOpen) {
              setSourcesOpen(false);
              return;
            }
            setSourceLoadFailed(false);
            if (!sourceRegistry) {
              try {
                const sourceData = await import("./data/scientist-sources.json");
                setSourceRegistry((sourceData.default as ScientistSourceFile).scientists);
              } catch {
                setSourceLoadFailed(true);
              }
            }
            setSourcesOpen(true);
          }
          '''
          if text.count(old) == 1:
              page.write_text(text.replace(old, new), encoding="utf-8")

          css = Path("app/globals.css")
          c = css.read_text(encoding="utf-8")

          dead_blocks = [
              '.portrait-illustration { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }',
              '.detail-button { margin-top: 26px; padding: 0 0 4px; border: 0; border-bottom: 1px solid #8993a0; background: none; cursor: pointer; font: 12px Arial, "Microsoft YaHei", sans-serif; }.detail-button span { margin-left: 12px; }',
              '.source-toggle { align-self: flex-start; margin-top: 14px; padding: 3px 0; border: 0; background: none; color: #7b8794; cursor: pointer; font: 11px Arial, "Microsoft YaHei", sans-serif; letter-spacing: .04em; }\n.source-toggle:hover { color: var(--ink); }\n.source-toggle span { margin-left: 7px; }',
          ]
          for block in dead_blocks:
              if c.count(block) != 1:
                  raise SystemExit(f"dead CSS block missing or duplicated: {block[:70]}")
              c = c.replace(block, "")

          c = c.replace(
              '.print-menu[open] summary { color: var(--ink); border-color: var(--ink); }',
              '.print-menu summary span { transition: transform .16s ease; }\n.print-menu[open] summary { color: var(--ink); border-color: var(--ink); }\n.print-menu[open] summary span { transform: rotate(180deg); }',
              1,
          )
          c = c.replace(
              '.utility-button span, .retry-button span, .feature-continue span { margin-left: 8px; }',
              '.utility-button span, .retry-button span { margin-left: 8px; }',
              1,
          )
          c = c.replace(
              '.feature-continue { align-self: flex-start;',
              '.feature-continue { display: inline-flex; align-items: center; justify-content: center; gap: 8px; align-self: flex-start;',
              1,
          )
          c = c.replace(
              '.portrait-switch button { min-height: 32px; padding: 5px 10px; }',
              '.portrait-switch button { min-height: 36px; padding: 6px 11px; }',
              1,
          )
          c = c.replace(
              '  .feature-utilities { gap: 4px 16px; }',
              '  .feature-utilities { gap: 4px 16px; }\n  .utility-button { min-height: 44px; }\n  .portrait-switch button { min-height: 40px; }\n  .field-filters button { min-height: 42px; }',
              1,
          )
          c = c.replace(
              '@media (prefers-reduced-motion: reduce) {\n  .skip-link, .feature-continue, .archive-open { transition: none; }\n}',
              '@media (hover: none) {\n  .archive-card:hover { transform: none; box-shadow: none; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  .skip-link, .feature-continue, .archive-open, .print-menu summary span { transition: none; }\n}',
              1,
          )
          css.write_text(c, encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate final UI
        run: |
          npm run audit:deps
          npm run typecheck
          npm run typecheck:worker
          npm run lint
          npm test
          npm run build:pages
          npm run check:pages

      - name: Commit cleanup
        run: |
          git rm .github/workflows/temp-ui-tune.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git commit -m "refactor: finish UI polish and remove dead styles"
          git push origin HEAD:feat/ui-polish
