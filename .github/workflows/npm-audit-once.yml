name: One-shot npm audit inspection

on:
  push:
    branches: ["audit/npm-remaining"]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Production-only audit
        run: npm audit --omit=dev --json || true
      - name: Full audit
        run: npm audit --json || true
      - name: Key dependency chains
        run: |
          npm ls image-size || true
          npm ls undici || true
          npm ls esbuild || true
          npm ls vite || true
          npm ls vinext || true
      - name: Outdated direct dependencies
        run: npm outdated --json || true
